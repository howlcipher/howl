name: Ecosystem interop

# Builds the listed main revisions and strictly checks nine descriptor producers; Forge has no descriptor. Resolves every
# command one component runs of another (docs/INTEROP.md). A missing command,
# flag, or schema fails, and so does a component that publishes no
# `interop --json` descriptor (every component in the check now does).
# Dispatch with strict=false to see a report without failing on warnings.

on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on warnings (missing descriptors) as well as failures
        type: boolean
        default: true
  pull_request:
    paths:
      - 'internal/interop/**'
      - 'tools/interop-check/**'
      - 'contracts/interop/**'
      - 'docs/INTEROP.md'
      - '.github/workflows/interop.yml'

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    env:
      HOWL_FORBID_LOCAL_INFERENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the Go components
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for repo in howlframe howlchangeops howlInstinct howlforge; do
            git clone --depth 1 --branch main "https://github.com/howlcipher/$repo.git" "$RUNNER_TEMP/src/$repo"
          done
          (cd "$RUNNER_TEMP/src/howlframe" && go build -o "$RUNNER_TEMP/bin/howlframe" howlframe.go)
          (cd "$RUNNER_TEMP/src/howlchangeops/adapter" && go build -o "$RUNNER_TEMP/bin/howlchangeops" .)
          (cd "$RUNNER_TEMP/src/howlInstinct" && go build -o "$RUNNER_TEMP/bin/howlinstinct" ./cmd/howlinstinct)
          (cd "$RUNNER_TEMP/src/howlforge" && go build -o "$RUNNER_TEMP/bin/howlforge" ./cmd/howlforge)
          go build -o "$RUNNER_TEMP/bin/howl" ./cmd/howl

      # Each Python component gets its own virtualenv, as `howl install` gives it.
      - name: Install the Python components
        run: |
          for repo in howlplane howlwriter howldream howlcreate howlproof howlrelay; do
            python -m venv "$RUNNER_TEMP/venv/$repo"
            "$RUNNER_TEMP/venv/$repo/bin/pip" install --quiet "git+https://github.com/howlcipher/$repo.git@main"
            ln -s "$RUNNER_TEMP/venv/$repo/bin/$repo" "$RUNNER_TEMP/bin/$repo"
          done

      - name: Resolve every edge
        run: |
          args=()
          for c in howlframe howlchangeops howlinstinct howlplane howlwriter howldream howlcreate howlproof howlforge howlrelay; do
            args+=(--bin "$c=$RUNNER_TEMP/bin/$c")
          done
          # Scheduled and pull-request runs have no inputs: strict by default.
          if [ "${{ inputs.strict }}" != "false" ]; then args+=(--strict); fi
          go run ./tools/interop-check "${args[@]}" \
            --components howlframe,howlchangeops,howlplane,howlwriter,howldream,howlcreate,howlproof,howlinstinct,howlrelay

      - name: Exercise real public forwarding and failure behavior
        env:
          HOWLPLANE_BIN: ${{ runner.temp }}/bin/howlplane
        run: python3 scripts/test_interop_runtime.py --howl "$RUNNER_TEMP/bin/howl"
