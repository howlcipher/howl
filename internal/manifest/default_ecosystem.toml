# Howl ecosystem release manifest.
#
# This is a tested, compatible combination of ecosystem component versions
# -- not "whatever is newest in each repository." See docs/MANIFEST.md for
# the schema and docs/ARCHITECTURE.md for why the install order below
# (howlframe -> howlchangeops -> howlplane-engine -> howlplane -> howlwriter)
# is required.
#
# As of the Release Artifacts v1 milestone, every component below installs
# via a real, checksummed GitHub Release artifact (github_release or
# github_release_python_wheel) under the standard profile -- no component
# still requires a local Go/Python toolchain or sibling source checkout to
# install. Each also declares a developer_install reproducing its previous
# source_build path, used only under `--profile developer`; standard-profile
# planning never looks at it, so there is no code path by which a missing
# or broken release artifact can silently fall back to building from source.
#
# Every component below has a published GitHub Release with checksummed
# assets (verified 2026-10-21 by installing this manifest into an empty
# home): howlframe v0.1.0, howlchangeops v0.2.0, howlplane v0.1.0 (Go
# binary and the howlplane-engine wheel), howlwriter v0.1.0.
#
# Component versions below:
#   - howlframe:        v0.1.0, the latest published release. HowlChangeOps
#                        0.2.0 accepts any 0.1.x reporting HFBC format 1.
#   - howlchangeops:     0.2.0 -- --json result envelopes, owner-confirmed
#                        approvals, XDG configuration. HowlPlane's bounded
#                        executor needs it (min_version below).
#   - howlplane:         0.1.0 -- the first release of the howlplane binary
#                        under this name (earlier v1.x/v2.0 tags were the
#                        standalone ai_installer, a different artifact).
#   - howlplane-engine:  0.1.0, the wheel built from the same tag. Not a
#                        component end users invoke directly (internal =
#                        true); howlplane delegates every non-"project"
#                        subcommand to it.
#   - howlwriter:        0.1.0.
schema_version = 1

[ecosystem]
name = "Howl"
version = "0.2.0"
channel = "stable"
description = "Mathematical rigor, capability boundaries, adversarial verification, and cryptographic human authority for AI-assisted engineering."

[[optional_capabilities]]
name = "ollama"
required = false
capability = "local-inference"

# ---------------------------------------------------------------------------
[[components]]
name = "howlframe"
display_name = "HowlFrame"
role = "Language, HFIR verification gate, and capability-bounded VM"
repository = "https://github.com/howlcipher/howlframe"
version = "0.1.0"
optional = false
platforms = ["linux", "darwin", "windows"]
archs = ["amd64", "arm64"]

  [components.install]
  method = "github_release"

    [components.install.github_release]
    repository = "howlcipher/howlframe"
    artifact_pattern = "howlframe_{version}_{os}_{arch}.{ext}"
    checksum_file = "SHA256SUMS"

  [components.developer_install]
  method = "source_build"

    [components.developer_install.source_build]
    checkout_name = "howlframe"
    language = "go"

      [components.developer_install.source_build.go]
      package = "."
      build_output = "howlframe"

  [components.health_check]
  type = "exec_version"
  args = ["--version"]

# ---------------------------------------------------------------------------
[[components]]
name = "howlchangeops"
display_name = "HowlChangeOps"
role = "Authority boundary and release controller"
repository = "https://github.com/howlcipher/howlchangeops"
version = "0.2.0"
optional = false
platforms = ["linux", "darwin", "windows"]
archs = ["amd64", "arm64"]

  [components.install]
  method = "github_release"

    [components.install.github_release]
    repository = "howlcipher/howlchangeops"
    artifact_pattern = "howlchangeops_{version}_{os}_{arch}.{ext}"
    checksum_file = "SHA256SUMS"

  [components.developer_install]
  method = "source_build"

    [components.developer_install.source_build]
    checkout_name = "howlchangeops"
    language = "go"

      [components.developer_install.source_build.go]
      package = "./adapter"
      build_output = "howlchangeops"
      sidecar_files = ["howlchangeops.hfbc"]

        [[components.developer_install.source_build.go.extra_steps]]
        run_component = "howlframe"
        args = ["check", "src/howlchangeops.howl"]

        [[components.developer_install.source_build.go.extra_steps]]
        run_component = "howlframe"
        args = ["build", "src/howlchangeops.howl"]

  [components.health_check]
  type = "exec_version"
  args = ["--version"]

  [[components.depends_on]]
  component = "howlframe"
  min_version = "0.1.0"

# ---------------------------------------------------------------------------
# The Python control-plane engine (howlplane.control_plane), distributed as its
# own wheel. Not exposed on PATH (internal = true): the howlplane Go binary
# below is what users invoke, and delegates to this component's activated
# console script for every subcommand it doesn't natively implement.
[[components]]
name = "howlplane-engine"
display_name = "HowlPlane Control-Plane Engine"
role = "Python control-plane engine backing the howlplane CLI"
repository = "https://github.com/howlcipher/howlplane"
version = "0.1.0"
optional = false
internal = true
platforms = ["linux", "darwin", "windows"]
archs = ["amd64", "arm64"]

  [components.install]
  method = "github_release_python_wheel"

    [components.install.github_release_python_wheel]
    repository = "howlcipher/howlplane"
    artifact_pattern = "howlplane-{pep440_version}-py3-none-any.whl"
    checksum_file = "howlplane-engine-SHA256SUMS"
    console_script = "howlplane"
    extras = []
    min_python = "3.11.0"

  [components.developer_install]
  method = "source_build"

    [components.developer_install.source_build]
    checkout_name = "howlplane"
    language = "python"

      [components.developer_install.source_build.python]
      package_dir = "."
      extras = []
      console_script = "howlplane"
      min_python = "3.11.0"

  [components.health_check]
  type = "python_import"
  module = "howlplane.control_plane"

  [[components.depends_on]]
  component = "howlchangeops"
  min_version = "0.2.0"

  [[components.external_dependencies]]
  name = "python3"
  required = true
  capability = "python-runtime"
  min_version = "3.11.0"

# ---------------------------------------------------------------------------
[[components]]
name = "howlplane"
display_name = "HowlPlane"
role = "AI engineering control plane"
repository = "https://github.com/howlcipher/howlplane"
version = "0.1.0"
optional = false
platforms = ["linux", "darwin", "windows"]
archs = ["amd64", "arm64"]

  [components.install]
  method = "github_release"

    [components.install.github_release]
    repository = "howlcipher/howlplane"
    artifact_pattern = "howlplane_{version}_{os}_{arch}.{ext}"
    checksum_file = "SHA256SUMS"

  [components.developer_install]
  method = "source_build"

    [components.developer_install.source_build]
    checkout_name = "howlplane"
    language = "go"

      [components.developer_install.source_build.go]
      package = "./cmd/howlplane"
      build_output = "howlplane"

  [components.health_check]
  type = "exec_version"
  args = ["--version"]

  [[components.depends_on]]
  component = "howlplane-engine"

  [[components.depends_on]]
  component = "howlchangeops"
  min_version = "0.2.0"

# ---------------------------------------------------------------------------
# HowlWriter runs HowlPlane's role dispatcher in its own process, so the
# engine's package (and its dependencies) is installed into HowlWriter's
# runtime as well (python_imports). Without it every model step reported
# that HowlPlane was missing or could not be imported.
[[components]]
name = "howlwriter"
display_name = "HowlWriter"
role = "Writing control and review system"
repository = "https://github.com/howlcipher/howlwriter"
version = "0.1.0"
optional = false
platforms = ["linux", "darwin", "windows"]
archs = ["amd64", "arm64"]
python_imports = ["howlplane-engine"]

  [components.install]
  method = "github_release_python_wheel"

    [components.install.github_release_python_wheel]
    repository = "howlcipher/howlwriter"
    artifact_pattern = "howlwriter-{pep440_version}-py3-none-any.whl"
    checksum_file = "SHA256SUMS"
    console_script = "howlwriter"
    extras = ["web"]
    min_python = "3.11.0"

  [components.developer_install]
  method = "source_build"

    [components.developer_install.source_build]
    checkout_name = "howlwriter"
    language = "python"

      [components.developer_install.source_build.python]
      package_dir = "."
      extras = ["dev"]
      console_script = "howlwriter"
      min_python = "3.11.0"

  [components.health_check]
  type = "exec_version"
  args = ["--version"]

  [[components.depends_on]]
  component = "howlplane"

  [[components.depends_on]]
  component = "howlplane-engine"

  [[components.external_dependencies]]
  name = "python3"
  required = true
  capability = "python-runtime"
  min_version = "3.11.0"
